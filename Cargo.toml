[package]
name = "mvr"
version = "0.2.0"
edition = "2021"
description = "batch rename files by regex: dry-run CLI + interactive TUI"
license = "GPL-3.0-only"
repository = "https://github.com/DevByG/mvr"
keywords = ["rename", "regex", "files", "tui", "cli"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
regex = "1"
natord = "1"
rhai = "1"
ratatui = "0.29"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "fat"
codegen-units = 1
opt-level = "z"
panic = "abort"
