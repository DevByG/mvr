[package]
name = "mvr"
version = "0.1.0"
edition = "2021"
description = "batch rename files by regex: dry-run CLI + interactive TUI"
license = "GPL-3.0-only"
repository = "https://github.com/alefimov/mvr"
keywords = ["rename", "regex", "files", "tui", "cli"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
regex = "1"
ratatui = "0.29"

[dev-dependencies]
tempfile = "3"
